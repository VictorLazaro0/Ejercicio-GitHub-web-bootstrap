<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paisajes</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

<header class="text-center mb-5">
            <h1 class="display-3 fw-bold text-success mb-2">Paisajes</h1>
            <p class="lead text-muted">Explora los lugares naturales más hermosos del mundo.</p>
        </header>

        <!-- Sección de Categorías con Badges -->
        <section class="row justify-content-center mb-5">
            <div class="col-md-8 text-center">
                <h2 class="h4 text-secondary mb-3">Categorías</h2>
                <div class="d-flex justify-content-center gap-2 flex-wrap">
                    <span class="badge bg-success fs-6 px-3 py-2 shadow-sm">Montañas</span>
                    <span class="badge bg-primary fs-6 px-3 py-2 shadow-sm">Playas</span>
                    <span class="badge bg-warning text-dark fs-6 px-3 py-2 shadow-sm">Bosques</span>
                </div>
            </div>
        </section>

        <!-- Sección de Tarjetas con Fotografías -->
        <section class="row g-4 justify-content-center">
            <!-- Tarjeta 1: Montañas Alpinas -->
            <div class="col-md-5">
                <div class="card h-100 shadow border-0 overflow-hidden rounded-4">
                    <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=600&q=80" class="card-img-top" alt="Montañas Alpinas" style="height: 220px; object-fit: cover;">
                    <div class="card-body text-center p-4">
                        <h3 class="h5 text-dark fw-bold">Montañas Alpinas</h3>
                        <p class="text-muted small mb-0">Majesticiosos picos nevados y paisajes imponentes.</p>
                    </div>
                </div>
            </div>

            <!-- Tarjeta 2: Bosque Tropical -->
            <div class="col-md-5">
                <div class="card h-100 shadow border-0 overflow-hidden rounded-4">
                    <img src="https://images.unsplash.com/photo-1511497584788-876761142212?auto=format&fit=crop&w=600&q=80" class="card-img-top" alt="Bosque Tropical" style="height: 220px; object-fit: cover;">
                    <div class="card-body text-center p-4">
                        <h3 class="h5 text-dark fw-bold">Bosque Tropical</h3>
                        <p class="text-muted small mb-0">Exuberante vegetación y una biodiversidad única.</p>
                    </div>
                </div>
            </div>
        </section>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
